# PR and main-branch quality gate for openehr-sdk-go.
#
# All checks invoke Makefile targets (see docs/ci.md). Do not duplicate
# go invocations here — extend the Makefile instead.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Format check
        run: make fmt-check

      - name: Module tidy check
        run: make mod-tidy-check

      - name: Codegen verify
        run: make codegen-check

      - name: AQL parser verify
        run: make aqlgen-check

      - name: Terminology codegen verify
        run: make termgen-check

      - name: Vet
        run: make vet

      - name: Spec traceability
        run: make spec-check

      # Offline sha256 only (no network, no curl/jq) — guards the pinned
      # upstream FLAT corpus against hand-edits.
      - name: Vendored fixture integrity
        run: make flat-check

      # Every EHRbase corpus records the one commit UPSTREAM_PINS.txt names
      # for its upstream repository (offline, no network).
      - name: Vendored corpus pins
        run: make corpus-pins-check

      # Same offline sha256 guard for the pinned openEHR Terminology, whose
      # whole value is being byte-identical to the TERM release (REQ-034).
      - name: Vendored terminology integrity
        run: make terminology-check

      # Same offline sha256 guard for the pinned BMM schemas, the codegen
      # inputs byte-identical to openEHR/specifications-ITS-BMM (REQ-041).
      - name: Vendored BMM integrity
        run: make bmm-check

      # The pinned ITS-XML schemas are a reference only; the same offline
      # sha256 guard keeps them byte-identical to their upstream commit.
      - name: Vendored ITS-XML integrity
        run: make its-xml-check

      - name: Build
        run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Unit tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./...

  race:
    name: Race
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Race detector
        run: make test-race
