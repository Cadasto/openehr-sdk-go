name: Docs CI

# Verification only — never publishes. This is the gate on PRs into main, so a
# broken site is caught before the merge that triggers docs-site.yml's deploy.
on:
  pull_request:
    branches: [main]
    # What `make docs-check` reads, and this file. The Makefile reads the
    # release tag from CHANGELOG.md and the ITS-REST tag from
    # resources/its-rest/MANIFEST.txt, and checks the `go get` pin in README.md
    # and docs/quick-start.md; check_brand_paths.py reads .gitignore. Keep the
    # list equal to docs-site.yml's.
    paths:
      - '.github/workflows/docs-ci.yml'
      - '.gitignore'
      - 'CHANGELOG.md'
      - 'Makefile'
      - 'make/**'
      - 'README.md'
      - 'docs/quick-start.md'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'pages/**'
      - 'resources/its-rest/MANIFEST.txt'
      - 'scripts/check_brand_paths.py'
      - 'scripts/sync_sources.py'
      - 'sources.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build and verify the site
        run: make docs-check
