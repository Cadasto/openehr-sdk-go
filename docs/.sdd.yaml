# docs/.sdd.yaml — the SDD project descriptor. Every /sdd-* skill reads this first
# to learn this repo's conventions; none of them hard-code paths or identifier styles.
# Schema: <sdd plugin>/references/traceability-schema.md §1. Methodology: §5 (identifiers).
# Do NOT switch req_style once published — it would renumber stable IDs (a major doc event).
sdd:
  profile: lightweight              # full | lightweight; lightweight = the requirements index is one registry file (REQ.md), no per-REQ detail files

  req_style: flat-numeric           # flat-numeric (REQ-NNN) — leaner for a library
  req_gap: 1                        # sequential: a new REQ takes the next free number above the
                                    # highest registered one. The old decadal topic bands are
                                    # historical and no longer allocated from; reservations and
                                    # retired numbers are listed in REQ.md § Numbering policy.
  excluded_areas: []                # area-prefixed only; tokens that are deliberately not areas

  # The document-kind vocabulary every `kind:` frontmatter value is checked against.
  doc_kinds: [requirement, specification, adr, guide, analysis, operations, reference, upstream]

  default_mode: spec-first          # the mode a specification has when its frontmatter names none

  paths:
    # Requirements use a REGISTRY model, not per-REQ files: the REQ-NNN index lives in
    # docs/specifications/REQ.md and each requirement's canonical normative prose lives in
    # exactly one topic spec in the same tree. There is deliberately no separate
    # docs/requirements/ dir (single canonical home — methodology §5).
    requirements: docs/specifications/REQ.md   # file form: the registry itself is the requirements index
    specifications: docs/specifications
    adr: docs/adr
    plans: docs/plans               # committed working notes; no gate, generator or map reads them

  # Single sources and what is generated from them (`make spec-gen`; `make spec-check` fails
  # when a generated block is stale). Edit the source, never the generated table.
  #   REQ citations in tests   -> each traceability.yaml row's tests: list
  #   traceability.yaml        -> docs/specifications/REQ.md registry table
  # The citation rule: docs/development-process.md § The ladder.
  # traceability.yaml is a pure index: no notes, no comments in rows (spec-check refuses them).

  traceability: docs/specifications/traceability.yaml

  build_entrypoint: make            # single entry point — extend the Makefile, no ad-hoc scripts
  ci_target: ci                     # full PR gate: `make ci` (includes spec-check)
  spec_check_target: spec-check     # traceability drift gate: `make spec-check`
  # Also: `make spec-gen` (regenerate the indexes). Two lanes — a change that alters no
  # normative statement owes no spec/plan edits: docs/development-process.md § Two lanes.
  # Also available: `make spec-context REQ=NNN` (one-shot bundle) and `make probe-status`.

  use_probes: true                  # PROBE-NNN conformance probes — catalog in docs/specifications/conformance.md
  use_strands: true                 # STRAND-NN open research questions — docs/specifications/research-strands.md
  upstream: ""                      # the spec tree is self-contained; no upstream SDD repo consumed

  # "Look it up, never guess" — the authoritative sources for this repo's domain facts:
  ground_truth: >-
    openEHR specifications and the vendored machine-readable contracts in resources/ —
    resources/its-rest/*.openapi.yaml (REST 1.1.0-development) and resources/bmm/*.bmm.json
    (RM/AM/BASE/LANG/TERM) — plus the openEHR MCP skills/assistant. Agents MUST look up RM
    paths, terminology codes, ITS-JSON/REST request-response shapes, and class invariants
    rather than guess. The conformance probe suite (testkit/probes, catalogued in
    docs/specifications/conformance.md) is the source of truth for wire-level semantics.

  check:
    script: scripts/sdd-check.py   # where the vendored gate lives
    version: "0.7.0"               # must equal the vendored tool's own version
    links:
      exclude: []                  # globs; printed in every report when non-empty
    changelog:
      path: CHANGELOG.md
      max_words: 35
    code_roots: []                 # for tree-to-map; must exist; empty = the repository minus docs/, .git/,
                                   # vendor/, node_modules/, every paths.*, the traceability map, check.script
    test_globs: ["*_test.go", "probe_*.go"]  # basename globs; probe_*.go is the testkit/probes implementations spec-gen counts as tests
    probes_catalogue: docs/specifications/conformance.md  # its headings carry the PROBE ids
    rfc2119:
      sections: requirement-id     # what heading opens a normative section: section-sign (§) | requirement-id | either
    families:                      # error | warn | off
      descriptor: error
      map-schema: error
      map-to-tree: error
      index-sync: error
      tree-to-map: warn
      doc-kinds: warn
      rfc2119: warn                # the per-kind table in sdd-check.md still errors for requirement/adr/reference
      one-home: error
      links: error
      changelog: warn
      generated: error
      draft-reason: off

  hooks:
    stop_nudge: true               # the session-stop hook's one-shot "record progress" nudge; false disables it in this repository

  # Delivery parameters. /sdd-deliver and /sdd-review read these instead of asking.
  # Every value here is an example: no model and no reviewer is required by the plugin.
  agents:
    worker_model: inherit           # per-dispatch model override; inherit = no override, or a host model id
    max_parallel_workers: 3
    worktree_per_worker: true       # parallel, mutating tasks only
    worker_skills: [go-coding:go-coding]  # skills named in the worker's brief (suggested from go.mod)
    reviewers: [go-coding:go-reviewer]    # this repo's own language reviewers, by agent name (suggested from go.mod)
    task_review: lane               # on | off | lane  (lane = on for full, off for maintenance)
    review_panel:                   # who reviews the PR, per lane; names are prompt targets, not integrations
      full: [claude, cursor]
      maintenance: [claude]
