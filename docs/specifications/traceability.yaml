  - id: REQ-117
    title: AQL expression-catalogue completion
    canonical: docs/specifications/clinical-modeling.md#req-117--aql-expression-catalogue-completion
    status: draft
    # Closes the REQ-113 v1 structured-AST catalogue gaps (all grammar-admitted
    # already — no grammar-profile change), widens the REQ-109 lint gate's two
    # documented over-rejections (ORDER BY on a SELECT alias; bare boolean
    # literals in comparison-operand and SELECT positions), and gives the
    # REQ-055 builder the containment
    # algebra (NOT CONTAINS, sibling AND/OR) plus opt-in in-text LIMIT/OFFSET
    # that the parse side already models. Driven by consumers building AQL
    # execution engines and conformance corpora on the structured AST, where
    # ErrIncompleteAST is fail-closed and every catalogue gap is a refused
    # statement.
    #
    # LANDED. All eight catalogue closures are modelled: primitive SELECT
    # literals (LiteralExpr) and mixed `SELECT *, col` (StarExpr), function
    # calls on either side of a comparison with Path/Value/Param/nested-call
    # arguments, path-valued operands (aql.PathValue), structured MATCHES
    # TERMINOLOGY / {URI} operands, the FROM-root containment junction
    # (parse.FromClause.Junction), and junctions over any in-catalogue operand.
    # The complete residual ErrIncompleteAST list is ONE class: a numeric
    # literal the AST cannot represent (LIMIT/OFFSET beyond Go `int`, a SELECT
    # TOP count beyond `int`, an INTEGER beyond int64, or a REAL beyond
    # float64, in any value position; degrading would be silent precision
    # loss), pinned by TestParseQuerySurfacesIncompleteAST. As first published
    # this REQ listed a second residual — a SELECT TOP clause — which REQ-118
    # CLOSED by adding the carrier; that history is informative only and no
    # requirement to refuse a top clause is in force.
    # TestFormerCatalogueGapsModelled asserts the nine round-trip cases covering the eight closed gap shapes
    # now parse, emit, and round-trip (PROBE-087).
    #
    # Lint (PROBE-028 unaffected, no new codes): parse.Document gains
    # SelectAliases so an ORDER BY key resolves FROM/CONTAINS first, then the
    # SELECT `AS` aliases (TestLintOrderBySelectAlias,
    # TestLintSelectAliasDoesNotBindClass); a bare boolean keyword in a value
    # position — a comparison operand, a SELECT projection item, or a function-call argument — is no longer
    # collected as a pseudo-path, and the structured AST carries it as a typed
    # literal on both sides (TestLintBooleanComparisonOperand,
    # TestLintSelectBooleanKeywordLiteral,
    # TestExtractPathsSkipsBooleanKeywordOperand,
    # TestExtractPathsSkipsBooleanKeywordSelectItem,
    # TestParseQuerySelectKeywordLiteral). An ORDER BY key is excluded: the
    # grammar's orderByExpr admits no literal, so it stays a path.
    #
    # Builder (PROBE-088): aql.Containment became a whole expression —
    # Class/Archetype leaves, Contains/NotContains nesting, ContainsAnd/
    # ContainsOr junctions with precedence-driven parentheses — plus opt-in
    # LimitInline/OffsetInline (+Param) refused against the envelope channel.
    # NOTE: Containment gained a slice field, so it is no longer ==-comparable
    # (fields unexported; no in-repo comparisons). A builder program using none
    # of the new API is byte-identical (the PROBE-020 golden is re-pinned by
    # TestProbe088DetectsProbe020Drift). DEFERRED: no builder entry point for a
    # FROM-root junction — the write side keeps a single root class until a
    # consumer needs write-side root junctions.
    implementation: landed
    packages:
      - openehr/aql
      - openehr/aql/parse
      - openehr/aql/lint
      - testkit/probes/aql
    probes: [PROBE-087, PROBE-088]
    tests:
      # PROBE-087 — catalogue closures, per-shape structural pins, and the
      # residual guards (unrepresentable numeric literal; SELECT TOP).
      - openehr/aql/parse/query_test.go
      - openehr/aql/parse/roundtrip_test.go
      - openehr/aql/introspect_test.go
      # Lint acceptances (REQ-109 surface) and the pseudo-path exclusion.
      - openehr/aql/lint/lint_test.go
      - openehr/aql/lint/extract_test.go
      - openehr/aql/parse/ast_test.go
      - openehr/aql/parse/parse_test.go
      # PROBE-088 — builder containment algebra, in-text paging, goldens.
      - openehr/aql/containment_test.go
      - openehr/aql/containment_roundtrip_test.go
      - openehr/aql/paging_test.go
      - openehr/aql/builder_internal_test.go
      - testkit/probes/aql/probes_test.go
    plans:
      - docs/plans/archive/2026-08-04-aql-expressivity-completion.md
      - docs/plans/archive/2026-08-18-aql-honesty-residuals.md

  - id: REQ-118
    title: Deprecated SELECT TOP clause and literal source text
    canonical: docs/specifications/clinical-modeling.md#req-118--deprecated-select-top-clause-and-literal-source-text
    status: draft
    # AMENDS REQ-117's residual ErrIncompleteAST list: the SELECT TOP clause
    # moves INTO the catalogue, leaving one residual (a numeric literal the
    # value vocabulary cannot represent — an out-of-range TOP count folds into
    # it). TOP is deprecated upstream (QUERY Release-1.1.0 §4.4.3, removal
    # announced) and therefore must still be READ and BUILT: the SDK does not
    # author the queries it is handed, and §4.4.3 additionally forbids TOP
    # together with LIMIT, which nothing in the SDK could report while the
    # clause was dropped at extraction.
    #
    # Two carriers: SelectClause.Top (count + FORWARD/BACKWARD direction,
    # deliberately NOT the LimitExpr vocabulary — the `top` production admits
    # no PARAMETER and LIMIT carries no direction, so reuse would model a shape
    # whose emission the parser rejects) and LiteralExpr source text (read-side
    # fidelity only: emission stays canonical, since the canonical write form
    # is normative and a constructed literal has no source text). The
    # canonical renderer a consumer needs for a constructed value already
    # exists as the public aql.FormatValue — no second escaping copy.
    #
    # Layer split for the spec-invalid TOP+LIMIT combination: parse models
    # both as written, Emit renders both (refusing would break the round-trip
    # property for text the profile accepts), lint diagnoses it
    # (aql_deprecated_top Warning / aql_top_with_limit Error — catalogue home
    # is the REQ-109 Layer-2 table), and the builder refuses at Build() with
    # TOP joined to the in-text paging channel's exclusivity rule.
    # The envelope channel got the same treatment on 2026-08-26: the sibling
    # code aql_top_with_fetch (Error) closes the read side of the Query API
    # common-parameters rule that `fetch` cannot be combined with AQL-top,
    # which Build() already refused. A sibling rather than a widened
    # aql_top_with_limit, so the landed code's firing rule and Detail text stay
    # byte-stable; keyed on Fetch alone, since Offset carries no exclusion.
    # PROBE-028's multiset is unaffected: no lint cassette carries a TOP.
    #
    # LANDED. parse.SelectClause.Top + Document.Top (the flat mirror the lint
    # gate reads), parse.LiteralExpr.Raw taken from the character-stream span
    # (GetText would drop interior whitespace, which is itself a
    # canonicalisation), aql.TopClause/TopDir/FormatTop as shared vocabulary,
    # Builder.Top / Builder.TopDirected with the exclusivity + non-negative +
    # known-direction refusals in validateTop, and the two lint codes. The
    # retired TestParseQuerySurfacesTopClauseGap is REPLACED by
    # TestTopClauseGapClosed (the positive assertion) — not deleted.
    # NOTE: `TOP $n` is NOT modelled: the profile's `top` production admits
    # INTEGER only, so the SDK-AQL-003 parameter relaxation is deliberately
    # not extended to a construct the spec is removing.
    implementation: landed
    packages:
      - openehr/aql
      - openehr/aql/parse
      - openehr/aql/lint
      - testkit/probes/aql
    probes: [PROBE-087, PROBE-088]
    tests:
      # PROBE-087 (extended) — TOP shapes in-catalogue + round-trip, literal
      # source text per literal kind, out-of-range TOP under the residual.
      - openehr/aql/parse/query_test.go
      - openehr/aql/parse/roundtrip_test.go
      # Lint diagnosis for the deprecated clause and the forbidden combination.
      - openehr/aql/lint/lint_test.go
      # PROBE-088 (extended) — builder TOP goldens + refusal matrix.
      - openehr/aql/paging_test.go
      - testkit/probes/aql/probes_test.go
    plans:
      - docs/plans/archive/2026-08-05-aql-top-carrier-literal-source-text.md
      - docs/plans/archive/2026-08-26-aql-small-corrections.md

  - id: REQ-119
    title: Re-parseable canonical AQL emission
    canonical: docs/specifications/clinical-modeling.md#req-119--re-parseable-canonical-aql-emission
    status: draft
    # WHY THIS EXISTS, in one line: REQ-055's "the typed builders cannot emit
    # syntactically invalid AQL" and REQ-117's fixed-point property are both
    # stated over the clause SHAPES the catalogue models, and nothing bound the
    # VALUE POSITIONS inside them. The rules themselves are normative in the
    # canonical section — see `canonical:` above; they are not restated here.
    #
    # WHY THE CORPUS COULD NOT HAVE CAUGHT IT: roundtrip_test.go is written in
    # canonical form, so no case ever carried a value that needed an escape, and
    # the value-level renderers were never confronted with the grammar. That is
    # the structural reason, and it is why PROBE-090 asserts round-trip IDENTITY
    # (and, for a source literal, TWICE) rather than mere parseability.
    #
    # Implementation-aligned fix-up per README § Source of truth for its first
    # cycles — the residuals reported on PR #87 — so the spec section and this
    # entry landed in the same PRs as the code. The class-predicate splice
    # (issue #99) was large enough to plan, and that plan is mapped below.
    #
    # WIRE-VISIBLE (all three classified semver-minor in the canonical section,
    # and in wire.md § REQ-055 where the canonical write form lives): a literal
    # carrying `'` or `\` and a whole-valued real (`2` -> `2.0`) emit
    # differently from v0.19.0, and predicate/path text is now re-emitted
    # VERBATIM rather than whitespace-collapsed — so emitted AQL carries the
    # caller's own spacing, line breaks and comments. The third is visible on
    # the READ side too (IdentifiedPath.Raw, PathSegment.Predicate,
    # ClassExpr.Predicate), so a consumer that COMPARES that text instead of
    # re-emitting it normalises through aql.StripPredicateTrivia — exported for
    # exactly that, after the verbatim switch made openehr/aql/lint's template
    # resolution miss a padded node id and report a false path divergence.
    # Recorded in the CHANGELOG.
    #
    # AMENDED for issue #103: Emit now confronts its own output with the parser
    # before returning it (§ Emission verified after emission). The consumer-
    # visible consequences, folded into one CHANGELOG bullet: Emit costs a
    # second parse, and it refuses what it once returned — the loud
    # malformations the per-position guards deliberately admit (now surfaced
    # as the PARSER's verdict), a WHERE whose expression renders nothing
    # (a typed-nil carrier once emitted with the clause silently GONE), and
    # a vocabulary shape the skeleton cannot model (fail-closed). The guards' own accept
    # sets are unchanged, so aql.ValidatePathPredicate still accepts a contained
    # malformation; only the emitter's contract narrowed.
    #
    # AMENDED again by REQ-163: § Emission verified after emission's Build()
    # exemption — stated on the ground that the builder's vocabulary carries no
    # free-text bracket or clause carrier — is NARROWED, not overturned. The
    # SELECT projection list was already such a carrier (aql.Col splices its
    # argument verbatim), so Build() takes the scope change this section wrote
    # down in advance and verifies the SELECT it emitted. Every other builder
    # field keeps the exemption, and the reduction, the carried-encodings list
    # and the value-free diagnostic rule stay homed here — REQ-163 cites them
    # rather than restating them.
    implementation: landed
    packages:
      - openehr/aql
      - openehr/aql/parse
      # The verbatim read side reaches the lint's Layer-3 OPT resolution, which
      # COMPARES predicate text rather than re-emitting it.
      - openehr/aql/lint
    plans:
      - docs/plans/archive/2026-08-08-aql-class-predicate-splice-and-source-text.md
      - docs/plans/archive/2026-08-18-aql-honesty-residuals.md
    probes: [PROBE-090]
    tests:
      # The two STRUCTURAL guards: a source-level tripwire failing any new
      # un-normalised dispatch site on a sealed vocabulary, and the
      # position x kind x carrier sweep (whatever a position accepts must
      # round-trip to an equal value; both carriers get the same answer).
      - openehr/aql/parse/dispatch_tripwire_test.go
      - openehr/aql/parse/value_position_parity_test.go
      # PROBE-090 — emit -> parse -> equal value across every value kind, the
      # twice-through fixed point, both string delimiters, the fuzz target,
      # and the grammar confrontations.
      - openehr/aql/parse/literal_roundtrip_test.go
      # The single-token IDENTIFIER / ARCHETYPE_HRID positions the emitters
      # splice verbatim (issue #96): the guard's accept set confronted with the
      # vendored lexer, and the Emit- and Build-side refusals at all four.
      - openehr/aql/parse/identifier_parity_test.go
      # The class BRACKET position the emitters splice verbatim (issue #99).
      # Three files because three distinct claims are made about it: that a
      # predicate survives extraction unmangled (identity, not parseability),
      # that the two sub-grammars one field feeds get two accept sets, and
      # that the guard agrees with the parser in BOTH directions over a
      # GENERATED corpus — the position has no token names to walk.
      - openehr/aql/parse/predicate_parity_test.go
      - openehr/aql/parse/predicate_guard_test.go
      - openehr/aql/parse/predicate_confrontation_test.go
      # The exported half, which a write path outside openehr/aql calls to
      # hold the same line.
      - openehr/aql/predicate_test.go
      # The closure verified AFTER emission (issue #103) — the one arm no
      # per-position rule can reach, because the token boundary depends on text
      # the position does not contain. Both directions: the cross-bracket
      # substitution refused on the STRUCTURAL arm, and the AST ENCODINGS the
      # parser is free to re-nest still accepted (the arm a field-by-field
      # comparison fails).
      - openehr/aql/parse/emit_verify_test.go
      # The white-box half: the fail-closed switch arms an external test cannot
      # reach, and the per-slot census — one row per skeleton coordinate,
      # covering the slots no splice vector reaches end-to-end.
      - openehr/aql/parse/emit_verify_internal_test.go
      # The read-side consequence: verbatim predicate text reaches the lint's
      # Layer-3 OPT resolution, which compares it to a node id. Pins that
      # trivia inside the bracket does not change the answer, and that
      # lint.Path.Suffix stays canonical (no raw newline in a diagnostic).
      - openehr/aql/lint/lint_test.go
      # Emit-side parity: the SELECT / paging / ORDER BY value positions, the
      # containment refusals and the order they fire in, the URI guard vs the
      # grammar, and the pointer twin of every sealed set the emitters dispatch
      # on (aql.WhereExpr, parse.SelectExpr, parse.LimitExpr).
      - openehr/aql/parse/emit_parity_test.go
      # Write-side refusals (URI, function name, TERMINOLOGY arity, the narrow
      # LIKE / MATCHES operand slots, the PARAMETER spelling, the junction
      # operator and arity), the pointer shapes, and the EqualValues contract.
      - openehr/aql/value_test.go
      # The canonical-form change: the builder golden that carried the SQL
      # doubling now carries the ESCAPE_SEQ spelling.
      - openehr/aql/builder_test.go

