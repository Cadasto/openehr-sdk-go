# The SDD traceability map: one row per REQ-NNN, linking it to its canonical spec
# section and to the packages, tests and probes that realise it. Plans and ADRs
# are not rows: make spec-context lists any plan that names the REQ and any ADR
# whose header names it.
#
# This is an index. Rows carry only the keys below — no notes and no comments
# (make spec-check refuses both); a fact worth keeping goes in the canonical spec,
# history stays in git. docs/specifications/REQ.md is generated from this file:
# edit here, then run make spec-gen. Each row's tests: list is generated by
# make spec-generate from the test files that cite the REQ; cite the REQ in the
# test rather than editing the list (docs/development-process.md § The ladder).
#
# Keys: id, title, canonical, status (draft|stable|deprecated), implementation
# (landed|partial|planned|retired), packages, tests, probes, fixtures.

