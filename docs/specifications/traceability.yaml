  - id: REQ-061
    title: SMART-on-openEHR PKCE
    canonical: docs/specifications/auth.md#req-061--pkce-flow
    status: draft
    implementation: landed
    packages: [auth/smart, auth]
    plans: [docs/plans/archive/2026-06-11-security-hardening-and-simplification.md, docs/plans/archive/2026-06-16-auth-smart-conformance-audit.md]
