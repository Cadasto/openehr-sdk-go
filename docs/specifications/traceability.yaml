  - id: REQ-080
    title: openEHR wire conformance
    canonical: docs/specifications/conformance.md#conformance-scope
    status: draft
    # Partial: the running probe suite under testkit/probes carries REQ-080
    # marks, and the FLAT-conformance plan landed the vendored upstream corpus
    # (testkit/cassettes/flat-conformance/ + sync/check tooling, integrity-gated
    # by `make ci`) plus, 2026-08-01, PROBE-086 itself — the round-trip harness
    # in testkit/conformance/webtemplate and its probe wrapper.
    #
    # PROBE-086 asserts parity against upstream-AUTHORED FLAT, which PROBE-076
    # structurally cannot: PROBE-076's input is this SDK's own output, so it
    # cannot see a path the SDK never emits or a leaf it drops symmetrically.
    # It earned that distinction immediately, catching a silent encode-side
    # data loss (EVENT.time, INSTRUCTION.narrative/expiry_time — 32 keys over
    # 30 fixtures) that PROBE-076 had run green over; fixed in rmpath the same
    # day (REQ-121).
    #
    # Scope, stated plainly: 356 of the corpus's 1824 keys are in the modelled
    # subset today (19.5%) — 1162 refused by the REQ-053 codec, 306 held out as
    # composition metadata. That hold-out is suffix-aware respellings (language,
    # territory, composer|name, composer_self, context/start_time, which REQ-053
    # reads and writes as the ctx/ short forms; the composer external_ref
    # suffixes are deliberately NOT held out — they are refused and visible in
    # the census) plus ONE waiver: context/setting decodes and then re-encodes
    # to nothing, so holding it out waives a real encode-side drop. ADR 0015
    # settled the spelling without clearing that: it is an emission gap
    # (ctx/setting is not written), so it clears when that emission lands.
    #
    # The earlier figure (90 / 4.9%) was a measurement error, not a smaller
    # codec: `category` was held out as metadata although it is a
    # template-constrained Web Template leaf on its own FLAT path, spelled
    # identically on both sides. Its 102 keys (34 fixtures × 3) were already
    # round-tripping byte-for-byte and are now compared — that is the whole of
    # the 90 → 192 move; no codec gap closed to earn it.
    #
    # 192 → 356 (2026-08-03) is the opposite: real codec gaps closing. The
    # CODE_PHRASE leaf mapping (ENTRY language/encoding, 136 keys over 68
    # refusals) removed that family from the census entirely, then the optional
    # DV_ORDERED/QUANTIFIED/AMOUNT suffixes added 28 more and removed every
    # per-datatype |suffix row but DV_TEXT's (which is subtype substitution, not
    # an optional attribute). See
    # docs/plans/archive/2026-08-03-flat-coverage-ratchet.md; the remaining ranked
    # inventory is in testkit/conformance/webtemplate/SKIPPED.md.
    #
    # The probe is exact on what it compares (no tolerated-drop list: a key
    # that decodes and then does not re-encode fails) and adds a coverage floor
    # (a fixture that compared zero keys fails, since Clean() is vacuously true
    # over an empty set). The per-fixture excluded/compared ratchet lives in
    # the harness's own runner_test.go pins, not in the probe.
    # The inventory and what would move it:
    # testkit/conformance/webtemplate/SKIPPED.md. Cassette/Live modes remain
    # out of scope, so REQ-082 stays a documented partial.
    implementation: partial
    packages:
      - testkit/probes
      - testkit/cassettes/flat-conformance
      - testkit/conformance/webtemplate
    probes: [PROBE-086]
    tests:
      - testkit/conformance/webtemplate/runner_test.go
      - testkit/conformance/webtemplate/helpers_test.go
      - testkit/probes/serialize/probes_test.go
    plans:
      - docs/plans/archive/2026-07-16-web-template-tests-conformance.md

