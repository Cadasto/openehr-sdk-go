  - id: REQ-113
    title: Execution-oriented parsed AQL AST
    canonical: docs/specifications/clinical-modeling.md#req-113--execution-oriented-parsed-aql-ast
    status: draft
    # ParseQuery + Document.Query expose a stable, generated-type-free
    # structured AQL AST (parse.Query) — the read-side mirror of
    # aql.Builder. SELECT items / FROM containment tree / WHERE
    # expression tree / ORDER BY / LIMIT / OFFSET, populated from the
    # validated ANTLR tree (parse/gen) via the private extractor.
    # WhereExpr + Value vocabulary is SHARED with the construction side:
    # parse populates the same Comparison/Junction/NotExpr/ExistsExpr/
    # MatchesExpr/LikeExpr/ParamValue/StringValue/IntValue/RealValue/
    # BoolValue/NullValue the Builder constructs. (*Query).Emit +
    # aql.FormatWhere close the round-trip loop. PROBE-080 (round-trip
    # property) is carried inline by openehr/aql/parse/roundtrip_test.go
    # — 87 idempotence cases plus 43 canonical-input preservation cases
    # across the catalogue, plus the residual-gap suite asserting
    # ParseQuery and Emit both surface aql.ErrIncompleteAST. The corpus
    # grew when REQ-117 closed this REQ's v1 catalogue gaps (2026-08-04)
    # and again when REQ-118 landed the SELECT TOP carrier (2026-08-05):
    # the extractor now covers the whole SDK grammar profile and the only
    # residual refusal is an unrepresentable numeric literal — see the
    # REQ-117 / REQ-118 rows and PROBE-087, which own that closure.
    # Out-of-catalogue shapes never silently emit: ErrIncompleteAST is
    # the trust-model surface. Tier 1 — Document.Tree — exposes the
    # validated ANTLR tree as a cheap interim (unstable consumer
    # contract; marked // Deprecated:) ahead of the REQ-113 Tier-2 AST.
    # The standing class predicate (ClassExpr.PredicateComparison)
    # and the WHERE comparison path (aql.Comparison.ParsedPath) are exposed
    # as parsed structure; the shared path vocabulary (aql.IdentifiedPath /
    # PathSegment) moved into openehr/aql (openehr/aql/path.go) with parse
    # aliases. PROBE-082 pins it inline in structured_test.go. The
    # class-predicate ParsedPath is now populated too (Segments with an empty
    # Alias, mirroring the WHERE side) so a consumer need not re-split the
    # relative predicate path.
    #
    # Two sections were added 2026-08-19 and BOTH LANDED the same day —
    # § Structured node predicates (a typed sum beside the verbatim predicate
    # text, path-SEGMENT position only; the class position keeps the carriers
    # above) and § Value-free structured drop records (a {kind, clause, span}
    # record beside ErrIncompleteAST, with no source text in any field).
    # Plans below; PROBE-095 / PROBE-096. The branch review then corrected the
    # predicate section's "empty unstructured set" claim: three
    # pathPredicateOperand forms are enumerated as unstructured, and the
    # grammar sweep now descends into that production.
    #
    # The drop records LANDED 2026-08-19 (PROBE-096): Document.Dropped(), a
    # ConstructKind closed over drop CLASSES rather than call sites, Clause
    # extended append-only, and Span as a line/col pair over Position. Writing
    # the unreachability arm caught a misclassification — an out-of-range
    # literal in a WHERE comparison reached a site labelled defensive, because
    # the gap travelled as a bare string — so the kind now travels with the
    # reason.
    #
    # § Structured node predicates LANDED the same day (PROBE-095):
    # PathSegment.Parsed carries a sealed sum over the whole pathPredicate
    # position — node id (± name), archetype HRID (± name), $param,
    # comparison, MATCHES regex, AND/OR junction — with components
    # delimiter-free, escape-resolved and trivia-free, plus EqualPredicates as
    # the panic-free equality the aql.Value comparability trap requires. The
    # class position is UNCHANGED and keeps the carriers above: two carriers
    # populated from one source node is drift by construction. Emission reads
    # Raw only, asserted rather than assumed.
    implementation: landed
    packages:
      - openehr/aql
      - openehr/aql/parse
    probes:
      - PROBE-080
      - PROBE-082
      - PROBE-095
      - PROBE-096
    tests:
      - openehr/aql/introspect_test.go
      - openehr/aql/parse/parse_test.go
      - openehr/aql/parse/query_test.go
      - openehr/aql/parse/structured_test.go
      - openehr/aql/parse/dropped_test.go
      - openehr/aql/parse/predicate_structure_test.go
      - openehr/aql/parse/roundtrip_test.go
    plans:
      - docs/plans/archive/2026-06-29-aql-execution-ast.md
      - docs/plans/archive/2026-07-13-path-encoding-and-classpred-parsedpath.md
      - docs/plans/archive/2026-08-18-aql-structured-node-predicates.md
      - docs/plans/archive/2026-08-18-aql-value-free-diagnostics.md
      - docs/plans/archive/2026-08-26-aql-small-corrections.md

  - id: REQ-116
    title: Template-level node naming and name-predicated paths
    canonical: docs/specifications/clinical-modeling.md#req-116--template-level-node-naming-and-name-predicated-paths
    status: draft
    # An OPT node may pin its LOCATABLE.name via a fixed C_STRING on the name
    # attribute. That template-level name — not the archetype concept term,
    # which every occurrence of a reused archetype shares — is what
    # distinguishes sibling archetype roots that fill a slot with the same
    # archetype. Spans four layers: parse + expose on the OPT node (REQ-100),
    # carry through the compiled tree (REQ-111), emit name predicates
    # ([archetype_id,'Name']) on the compiled AQL path of every node that pins
    # a name, and prefer the name for WebTemplate id derivation (REQ-106,
    # ADR 0014). Established against the upstream EHRbase goldens 2026-07-29:
    # the reference disambiguates by name alone (no numeric suffix appears in
    # corona_anamnese / multi_occurrence / AlternativeEvents, because each
    # sibling pins a distinct name), and name-predicates aqlPath 350x in the
    # corona golden vs 0x in constrain_test — which is why PROBE-075 holds
    # 104/104 without any of this. CORRECTED 2026-07-30: the predicate trigger
    # is the pinned name ALONE, not sibling collision — GECCO_Diagnose
    # predicates all three /content children though their archetype ids are
    # distinct, and predicates a sole CLUSTER child; every predicate name in
    # both goldens is a pinned C_STRING (1:1), and constrain_test pins none,
    # which is the real reason parity holds. An earlier collision-conditioned
    # reading of this rule was wrong and would emit too few predicates.
    # LANDED 2026-07-31 (Phases 0-5). Unblocked PROBE-086 (upstream FLAT
    # parity), which landed on it 2026-08-01, and exports any
    # WebTemplate reusing an archetype among siblings. Where no pinned name
    # separates siblings the reference's ordinal fallback applies (dv_text,
    # dv_text2) — evidenced by the upstream FLAT bodies themselves. Path shape is consumed by
    # REQ-102 validation, REQ-107 instance synthesis, and REQ-053
    # FLAT/STRUCTURED, so paths through un-named nodes must stay byte-identical
    # — but every vendored OPT that pins a name does change shape.
    #
    # PROBE-086 is deliberately NOT in `probes:` — this REQ *unblocks* it; the
    # probe asserts REQ-053 FLAT parity, not the naming rule this REQ states,
    # so citing it here would claim coverage it does not give. That holds now
    # that PROBE-086 is Implemented, for the same reason it held while it was
    # Draft.
    implementation: landed
    packages:
      - openehr/template
      - internal/templatecompile
      - openehr/templatecompile
      - openehr/template/webtemplate
      # Phase 3: the FLAT codec strips the name predicate at the rmpath
      # resolution boundary and keys its name index on the bare spelling.
      - openehr/serialize/simplified
      # Phase 0 vendored the two oracles here and added the accessors that
      # resolve them (paths.go carries the REQ-116 marks).
      - testkit/fixtures
      - testkit/cassettes/webtemplate
    adrs: [docs/adr/0014-webtemplate-reference-implementation-lock.md]
    probes: [PROBE-075]
    tests:
      - internal/templatecompile/registerpath_test.go
      - internal/templatecompile/flat_conformance_compile_test.go
      - internal/templatecompile/webtemplate_oracle_compile_test.go
      - openehr/template/webtemplate/req116_gap_test.go
      - openehr/template/node_name_test.go
      - internal/templatecompile/compile_nodename_test.go
      # Phase 3 — the emission guard (byte-identity for templates pinning
      # no name) and the FLAT boundary where the predicate is stripped.
      - internal/templatecompile/pathsnapshot_test.go
      - internal/templatecompile/namepredicate_test.go
      - openehr/serialize/simplified/flat_nameindex_test.go
      # Post-review hardening: decode through a pinned container (the
      # bare-keying regression), the reused-sibling refusal, and the
      # next-free ordinal fallback.
      - openehr/serialize/simplified/flat_pinned_test.go
      - openehr/template/webtemplate/dedupe_test.go
      # Phase 4 — PROBE-075 parity extended to both oracles (node facts and
      # inputs), with the documented residuals pinned by count.
