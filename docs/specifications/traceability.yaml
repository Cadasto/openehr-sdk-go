  - id: REQ-053
    title: FLAT and STRUCTURED
    canonical: docs/specifications/wire.md#req-053
    status: draft
    # Bidirectional FLAT + STRUCTURED codecs in openehr/serialize/simplified,
    # driven by the REQ-106 Web Template: encode (rm.Composition -> FLAT /
    # STRUCTURED via rmpath), decode (canonical RM rebuild via rminfo + canjson),
    # and OPT-free FLAT<->STRUCTURED interconversion. Round-trip verified for the
    # composition/observation spine (incl. ITEM_SINGLE/ITEM_LIST). First-class
    # datatypes: DV_TEXT/CODED_TEXT/DATE_TIME/DATE/TIME/QUANTITY/COUNT/BOOLEAN/
    # DURATION/URI/EHR_URI/ORDINAL/PROPORTION/IDENTIFIER; ctx/ context (language,
    # territory, composer, time); |other open value-sets; |raw canonical-fragment
    # bypass makes decorated/exotic datatypes lossless. Strict, fail-loud posture:
    # unresolvable paths, unsupported datatypes, missing required suffixes, missing
    # mandatory context, and out-of-bound :index are errors, not silent data loss
    # (see openehr/serialize/simplified/deviations.md). PROBE-076 (landed) round-
    # trips the vendored EHRbase Test_dv_* corpus (24 pass, 1 skip): idempotence
    # PLUS OPT-conformance — a WithTemplate(compiled) decode of a valid source
    # validates against the OPT. WithTemplate repopulates LOCATABLE.name (from the
    # archetype terminology) and completes the RM-mandatory attributes FLAT does
    # not carry (HISTORY.origin, EVENT.time, ENTRY language/encoding/subject,
    # EVENT_CONTEXT.setting, COMPOSITION category/composer) from ctx + RM defaults;
    # names/defaults never leak into FLAT. Deferred (documented, deviations.md):
    # the remaining ctx/ short forms not emitted on encode (workflow ids /
    # composer external_ref — optional, no validity impact; non-default source
    # values for the defaulted attributes are not round-tripped; the
    # EVENT_CONTEXT optionals participations / health_care_facility / end_time /
    # location are NOT deferred ctx/ forms — ADR 0016 assigns them to the
    # REQ-140 underscore grammar); .schema media
    # types on input. First-class _-attr decomposition is NO LONGER deferred:
    # REQ-140 landed the whole underscore grammar on 2026-08-05, which narrowed
    # the |raw boundary rather than relying on it (wire.md § REQ-140). The upstream byte-conformance probe landed 2026-08-01 as
    # PROBE-086 (testkit/conformance/webtemplate) — deliberately not in this
    # REQ's probes: list; it exercises this codec, but REQ-080 owns it.
    #
    # Datatype coverage widened 2026-08-03 by the PROBE-086 ratchet: standalone
    # CODE_PHRASE leaves (ENTRY language/encoding) round-trip as |code +
    # |terminology, and leaf-ness is decided by simplified.isValueLeafType rather
    # than by the presence of Web Template input descriptors — the reference emits
    # those in-context leaves with no inputs, so an Inputs test skipped them as
    # structural.
    #
    # Decode input surface amended by ADR 0015: the reference's real-path
    # composition metadata (<root>/language|code, composer|name,
    # context/start_time, …) is accepted alongside the ctx/ short forms and
    # normalised onto them; ctx/ stays the only EMITTED spelling, so this is
    # additive and moves no PROBE-086 number (the probe re-encodes, so a real-path
    # key still returns respelled). The composer external_ref suffixes are NOT
    # aliases and stay refused (visible in the census).
    #
    # Amended 2026-08-05 (plan 2026-08-05-flat-rm-attributes.md, PR 1):
    # context/setting joins the respellings — ctx/setting|code + |value are
    # emitted when EVENT_CONTEXT.setting is populated and accepted on decode,
    # closing the emission gap ADR 0015 left open (the census's one waiver).
    # The DV_CODED_TEXT-at-DV_TEXT substitution is carried in suffix form
    # (|code + |value + |terminology, with no bare key) instead of |raw — the one
    # suffix-form substitution; the ctx-only emission rule is scoped to the six
    # respelled scalar fields (ADR 0016), the EVENT_CONTEXT optionals riding
    # the REQ-140 underscore grammar instead.
    #
    # Amended 2026-08-05 (same plan, PR 2 — the datatype-leaf closures REQ-140's
    # machinery enabled). DV_PARSABLE (bare value + |formalism) and DV_MULTIMEDIA
    # (bare **uri** + |mediatype + |size + |data + |alternatetext +
    # |integrity_check + the two algorithms) are first-class leaves at a Web
    # Template node and at every nested position the underscore grammar reaches
    # one; a DV_PARSABLE at a leaf is now always fully captured and never rides
    # |raw. DV_INTERVAL<T> is not a suffix set but the REQ-140 interval grammar,
    # anchored on the bound datatype the Web Template names inside the angle
    # brackets — a bare, unparameterised DV_INTERVAL names none and stays on
    # |raw. The ENTRY `subject` (PARTY_PROXY) round-trips through the party
    # grammar, PARTY_SELF spelled by the absence of every party key, which is
    # what keeps the WithTemplate completion byte-identical on re-encode; the
    # composition-metadata leaves are held back by name (ctxOnlyLeafPaths) now
    # that PARTY_PROXY is emittable, rather than by a datatype gap. Two
    # terminology decisions are recorded rather than inferred: the vendored
    # openEHR `participation mode` group (the only vocabulary this codec
    # carries, because |mode has no code channel) and the implied
    # IANA_media-types identifier for DV_MULTIMEDIA.media_type (a code-set
    # identifier, not a vocabulary — and refused for a value coded elsewhere,
    # which rides |raw whole). The remaining coded-at-text carve-out is
    # unchanged: only a *fully-captured* DV_CODED_TEXT at a DV_TEXT leaf takes
    # the suffix form, a decorated one still rides |raw. `ctx/setting` and the
    # standalone CODE_PHRASE leaves (now with |preferred_term) are as noted
    # above. STRUCTURED gained the `"|"` member — a bare leaf value beside the
    # same leaf's members, which a DV_MULTIMEDIA leaf always has; it is this
    # codec's choice within the format's conventions, not corpus-pinned.
    # Still deferred: `.schema` media types on input, ACTIVITY
    # action_archetype_id (STRING — the last unmapped leaf type on encode), and
    # reused-sibling FLAT (the REQ-116 residual, fail-loud in both directions).
    #
    # Tidied 2026-08-06 (no behaviour change; the REQ-140 block carries the
    # mirror note). The STRUCTURED `"|"` member gained RFC-2119 force — it was
    # described, not required, in a paragraph where every other obligation
    # carried a keyword: MUST on the object form, on the empty-suffix reading in
    # both interconversion directions, and on the bare-scalar rule for a leaf
    # that cannot collide, plus the not-corpus-pinned standing (ADR 0014 governs
    # if a reference spelling appears) that deviations.md already claimed
    # wire.md recorded. The three LEAF datatype suffix sets this REQ's comment
    # has described since PR 2 -- DV_PARSABLE, DV_MULTIMEDIA, DV_INTERVAL<T> --
    # moved out of § REQ-140's table into wire.md § REQ-053 § Leaf datatypes,
    # so the normative home now agrees with this block, deviations.md and the
    # test citations; § REQ-140 keeps a pointer and retains the two behavioural
    # rules that govern the underscore positions too.
    implementation: landed
    adrs:
      - docs/adr/0015-flat-metadata-spelling.md
      - docs/adr/0016-event-context-optionals-underscore-spelling.md
    packages:
      - openehr/serialize/simplified
    probes:
      - PROBE-076
    plans:
      - docs/plans/archive/2026-07-14-flat-structured-codecs.md
      - docs/plans/archive/2026-08-03-flat-coverage-ratchet.md
      - docs/plans/archive/2026-08-05-flat-rm-attributes.md
    tests:
      - openehr/serialize/simplified/simplified_test.go
      - testkit/probes/serialize/probe_076_simplified_round_trip.go
      - openehr/serialize/simplified/independence_test.go
      - openehr/serialize/simplified/datatypes_test.go
      - openehr/serialize/simplified/flat_encode_test.go
      - openehr/serialize/simplified/flat_decode_test.go
      - openehr/serialize/simplified/structured_test.go
      - openehr/serialize/simplified/roundtrip_test.go
      - openehr/serialize/simplified/hardening_test.go
      - openehr/serialize/simplified/context_test.go
      - openehr/serialize/simplified/raw_test.go
      - openehr/serialize/simplified/names_test.go
      # The 2026-08-05 datatype-leaf closures: the encapsulated and interval
      # leaves, the ENTRY subject, and the DataValue members they share with
      # REQ-140's grammar.
      - openehr/serialize/simplified/rmattr_encapsulated_test.go
      - openehr/serialize/simplified/rmattr_party_test.go

