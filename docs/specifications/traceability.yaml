  - id: REQ-094
    title: Prefer negotiation
    canonical: docs/specifications/transport.md#req-094--prefer-response-shape-negotiation
    status: draft
    implementation: landed
    packages: [transport, openehr/client/ehr, openehr/client/ehr/composition, openehr/client/ehr/directory, openehr/client/ehr/ehrstatus, openehr/client/ehr/contribution, openehr/client/demographic]
    probes: [PROBE-061, PROBE-071]
    plans: [docs/plans/archive/2026-08-18-write-result-contract.md, docs/plans/archive/2026-08-30-read-path-decode-taxonomy.md]
    tests:
      - openehr/client/ehr/composition/composition_test.go
      - openehr/client/ehr/directory/directory_test.go
      - openehr/client/ehr/ehrstatus/ehrstatus_test.go
      - openehr/client/ehr/resource_test.go
      - openehr/client/ehr/write_test.go
      - openehr/client/ehr/ehr_test.go  # TestCreateEmpty2xxBody -- ehr.Create's empty/null-body arm
      - openehr/client/ehr/contribution/representation_test.go
      - openehr/client/demographic/party_test.go
      - testkit/probes/versioned/probe_071_composition_write_response_shape.go
    notes: >-
      All three write-path modes landed for the shared WriteResult family
      (composition / directory / ehr_status / demographic): return=representation
      bare-body decode (PROBE-061/071); return=identifier populates the
      VersionMetadata identifier slot from the ITS-REST Identifier body
      (ehr.ResolveIdentifierBody); a 2xx representation with an empty body
      returns NoRepresentationError wrapping transport.ErrInvalidShape
      (no silent downgrade); an undecodable body returns
      NoRepresentationError wrapping the decoder's error. Both carry the
      commit metadata and are distinguishable via errors.As. HasResource is the
      reflection-free typed-nil guard for the absent-resource success path.
      contribution.Commit carries minimal and the representation decode only
      and obeys the same NoRepresentationError rule; the identifier slot is
      never populated from the body (deferred in that plan). Deferred:
      PROBE-065 minimal->GET identifier round-trip (tracked in the
      probe-runnability plan, docs/plans/2026-08-18-probe-runnability.md).
      Amended 2026-09-01 (closes the ehr.Create keyed exception): ehr.Create's
      empty/null-body arm is now a typed NoRepresentationError, matching the
      versioned-write family; its decode-failure arm remains typed by REQ-151
      as *transport.DecodeError, unaffected by this closure.

  - id: REQ-095
    title: OpenAPI authoritative source
    canonical: docs/specifications/wire.md#req-095
    status: draft
    implementation: partial
    packages: [testkit/cassettes/its_rest, transport, openehr/client, openehr/client/definition, openehr/client/query, openehr/client/admin, openehr/client/demographic, openehr/client/ehr, openehr/client/ehr/composition, openehr/client/ehr/contribution, openehr/client/ehr/directory, openehr/client/ehr/ehrstatus]
    probes: [PROBE-072]
    adrs: [docs/adr/0019-definition-timestamp-tolerance.md]
    plans:
      - docs/plans/archive/2026-06-19-its-rest-conformance-remediation.md
      - docs/plans/archive/2026-07-13-path-encoding-and-classpred-parsedpath.md
      - docs/plans/archive/2026-08-30-definition-metadata-decoding.md
    notes: >
      Amended 2026-08-30 (ADR 0019): the section now carries one KEYED exception
      to the OpenAPI-authoritative rule -- the REQ-144 Definition metadata
      timestamp decode tolerance, which accepts StoredQueryMetadata.saved values
      the pin's `format: date-time` excludes; further exceptions must be named
      in the section, so no ADR overrides REQ-095 from outside.

      Path-parameter encoding: the transport is the single canonical path
      encoder (Request.Path is a decoded url.URL.Path); leaf clients interpolate
      the raw id and MUST NOT pre-escape with url.PathEscape (which double-encodes
      an id carrying an encodable character: a space → %2520 → 404). Retired the
      pre-escape pattern across every openehr/client leaf client; enforced
      tree-wide by TestNoPathEscapeInClientPathParams (openehr/client) and pinned
      behaviourally by per-client single-encode tests.
    tests:
      - openehr/client/ehr/contribution/update_audit_test.go
      - openehr/client/ehr/contribution/version_test.go
      - testkit/probes/versioned/probe_072_contribution_submission_shape.go
      - transport/path_encoding_test.go
      - openehr/client/pathencoding_guard_test.go
      - openehr/client/definition/path_encoding_test.go
      - openehr/client/query/path_encoding_test.go
