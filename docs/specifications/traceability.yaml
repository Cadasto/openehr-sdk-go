      set, error texts and emission byte-identical to pre-REQ-162. Held to
      read/write parity with lint by PROBE-097's arm (c), including its
      non-vacuity guard over the containment-code corpus.

  - id: REQ-163
    title: AQL write-side expressivity parity
    canonical: docs/specifications/clinical-modeling.md#req-163--aql-write-side-expressivity-parity
    status: draft
    implementation: landed
    packages:
      - openehr/aql
      - testkit/probes/aql
    probes: [PROBE-088, PROBE-097]
    plans: [docs/plans/archive/2026-08-26-aql-write-side-parity.md]
    tests:
      - openehr/aql/version_test.go
      - openehr/aql/version_internal_test.go
      - openehr/aql/standing_test.go
      - openehr/aql/standing_internal_test.go
      - openehr/aql/projection_test.go
      - openehr/aql/projection_internal_test.go
      - openehr/aql/projection_confrontation_test.go
      - openehr/aql/containment_roundtrip_test.go
      - openehr/aql/verify_parity_test.go
      - openehr/aql/parse/dispatch_tripwire_test.go
      - testkit/probes/aql/probe_097_semantic_lint.go  # PROBE-097 arm (c), widened to REQ-163's now-buildable rows
      - testkit/probes/aql/probes_test.go
    notes: >-
      Write-side carriers for the three class- and projection-position
      vocabularies the read side already models: the sealed three-shape
      version predicate (versionPredicate : LATEST_VERSION | ALL_VERSIONS |
      standardPredicate) reached through the VERSION-fixed aql.Version, the
      one-comparison class standing predicate
      (Containment.Predicated, four refusals — junction receiver, archetype
      pair, second standing predicate, VERSION routing), and the typed
      projection mirroring parse.SelectClause (DISTINCT, AS,
      aggregate/function and literal items, star). Two API forks settled in
      the prose rather than in code: Col keeps its signature and its
      leniency while Build() gains the after-emission structural
      verification REQ-119's own scope-change clause anticipated, and a
      standing predicate on a VERSION-spelled node is refused with an error
      naming the version-predicate constructor (one carrier per grammar
      position). Build()'s verification compares the clause-level flags
      including the deprecated TOP's FORWARD/BACKWARD direction, and fails
      closed on a lexical region a Col leaves open where the clause ends;
      beside it four typed constructions the grammar does not admit at the
      position they render are refused — a FuncCall-shaped Lit, an
      aggregate-shaped Fn argument, a function-shaped comparison operand in
      either bracket carrier, and a VersionPredicate shape outside the sealed
      three, that last reachable by EMBEDDING the exported interface and so
      refused rather than panicked (REQ-025). No new probe id: PROBE-088
      gained fifteen golden fixtures and four refusal rows, PROBE-097 arm (c)
      four parity rows that were builder-inexpressible; what stays
      unspellable is the FROM root's own bracket in every spelling. Additive
      — PROBE-020's golden is byte-unchanged and no REQ-161/162 code or
      contract moves. The two changes to previously-accepted behaviour
      § Additivity enumerates are called out in the CHANGELOG: the Build()
      refusal class above (semver-minor on REQ-119's footing), and
      aql.SelectField losing useful ==-comparability — == still COMPILES and
      panics at run time whenever either operand carries a call-shaped field,
      map insertion likewise, the trap aql.Containment set in v0.18.0.

  - id: REQ-164
    title: AQL path-shape and paging lint
    canonical: docs/specifications/clinical-modeling.md#req-164--aql-path-shape-and-paging-lint
    status: draft
    implementation: landed
    packages:
      - openehr/aql/lint
      - openehr/aql/contain
      - testkit/probes/aql
    tests:
      - openehr/aql/lint/pathshape_test.go  # aql_path_repeating_unpredicated, the walk's stops as seen from outside
      - openehr/aql/lint/pathshape_parseonly_test.go  # aql_paging_no_order_by, aql_select_no_alias
      - openehr/aql/lint/pathshape_fanout_test.go  # aql_fanout_path_grain
      - openehr/aql/lint/pathshape_redundant_test.go  # aql_contains_redundant_step
      - openehr/aql/lint/pathshape_internal_test.go  # § The conservative segment walk — each silent stop by name, and containsChain
      - testkit/probes/aql/probe_099_path_shape_lint.go
      - testkit/probes/aql/probes_test.go  # the PROBE-099 corpus, its able-to-fail guard controls, and the PROBE-028 baseline table
    probes: [PROBE-099]
    plans: [docs/plans/archive/2026-08-26-aql-path-shape-lint.md]
    notes: >-
      Third additive REQ-109 Layer-2 group: path shape. Five Warning codes
      shipped -- aql_path_repeating_unpredicated (an unpredicated
      multi-valued RM segment in SELECT, WHERE or ORDER BY alike, typed
      through rminfo's flattened AttributeRMType / IsContainer),
      aql_paging_no_order_by (in-text LIMIT and the Options.Query envelope's
      Fetch/Offset, no ORDER BY), aql_select_no_alias (per unaliased SELECT
      item, star items exempt), aql_fanout_path_grain (the PATH source of
      engine-defined row multiplicity, SPECQUERY-9, once per alias --
      sibling of REQ-161's junction-source aql_fanout_row_grain, whose
      catalogue row gains only the scope-boundary sentence) and
      aql_contains_redundant_step (an unreferenced, predicate-less,
      non-root, non-leaf operand whose class is unavoidable under the
      REQ-160 relation). The segment walk is conservative in the Layer-3
      style: an unknown class, an attribute the pin does not declare, a BMM
      generic parameter (EVENT.data is typed T, as ORIGINAL_VERSION.data is)
      or a $param archetype scope ends it silently, so the walk's reach on
      the current pin is bounded and the spec says so. Always on rather than
      Options-gated (no code flips Result.OK(); a caller filters by Code)
      with the rejected style-gate alternative recorded. No
      double-reporting: a VERSIONED_OBJECT-conforming operand keeps
      REQ-161's aql_versioned_object_unreferenced. The redundant-step check
      was specified as CUTTABLE -- the group's one check needing a new
      REQ-160 relation query -- and implementation review KEPT it, so the
      group ships five codes and not four; the fork is recorded in REQ-164
      § The redundant-step ruling rather than erased, and the code string
      stays un-reusable either way. That query landed as
      TypeRelation.Unavoidable (reachability with one vertex excluded,
      outside the verdict memo) and is also why aql_contains_redundant_step
      is the one REQ-164 code Options.Relation governs -- a route fact is
      exactly what an overlay edge states -- while it gates none; the other
      four split in two pairs, the two the segment walk feeds asking class
      questions no relation may answer differently and the two parse-only
      ones consulting no RM fact at all. PROBE-099 (Implemented, inline)
      carries the corpus: per-code positive, per-rule negative near-miss,
      and the PROBE-028 re-baseline, which is RECORDED in the PROBE-099
      catalogue entry in conformance.md -- valid.aql and missing_archetype.aql
      each gained exactly aql_select_no_alias, bad_syntax.aql nothing.
