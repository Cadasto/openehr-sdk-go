  - id: REQ-140
    title: Underscore-prefixed RM attributes (simplified formats)
    canonical: docs/specifications/wire.md#req-140--underscore-prefixed-rm-attributes
    status: draft
    # The Simplified Formats "RM Attributes prefix" grammar for the REQ-053
    # codecs: optional RM attributes the template does not constrain, addressed
    # as `_`-prefixed segments (_uid, _link:N, _feeder_audit, _work_flow_id,
    # _guideline_id, _other_participation:N, context/_health_care_facility,
    # context/_participation:N, context/_end_time, context/_location,
    # _normal_range, _other_reference_ranges:N, _mapping:N, _null_flavour,
    # _null_reason, DV_MULTIMEDIA _charset/_language/_thumbnail, and nested
    # _identifier:N). Recursive, RM-type-keyed, both directions, REQ-053's
    # fail-loud posture. Suffix vocabulary is the reference implementation's
    # (ADR 0014), pinned by the PROBE-086 corpus (1092 of 1824 keys carry an
    # `_` segment). EVENT_CONTEXT optionals ride this grammar per ADR 0016
    # (no new ctx/ short forms). Deliberate exclusions: composer external_ref
    # + composer/_identifier (ADR 0015 boundary); _instruction_details and
    # _wf_definition deferred as typed refusals (no pinnable fixture yet).
    #
    # LANDED 2026-08-05 over four phases (plan 2026-08-05-flat-rm-attributes.md,
    # PR 2). The whole grammar table is carried in both directions, byte-exact:
    # the decode router keyed by the owner's RM class (an `_` segment ends Web
    # Template resolution at the segment before it) plus the encode hook on the
    # owner walk; the simple families (_uid, _link:N, _work_flow_id,
    # _guideline_id, context/_end_time, context/_location); the value
    # decorations (_normal_range, _other_reference_ranges:N with the RM `range`
    # level elided, _mapping:N, _null_flavour beside an absent bare value,
    # _null_reason); the party grammar in one implementation for every position
    # it reaches a party (context/_health_care_facility, context/_participation:N,
    # _other_participation:N with the reference's inlined |identifiers_*:N, the
    # nested _identifier:N, _provider, and the ENTRY subject leaf); and the
    # deepest family, _feeder_audit, whose tails nest three levels
    # (…/originating_system_audit/provider/_identifier:0|id). Owner
    # admissibility comes from rminfo, not a hand table. Census: PROBE-086
    # compared keys 360 -> 1466 of 1824 (19.7% -> 80.4%), the whole `path not in
    # web template` refusal family bar 22 keys collapsed; PROBE-089 pins the
    # per-family round-trip, the canonical-transit encode, the refusals and the
    # STRUCTURED vocabulary. Corpus corrections settled against the plan and
    # amended into wire.md in the same commits: the REFERENCE_RANGE `range`
    # elision, the asymmetric interval boundary flags, |mode carrying the
    # participation-mode rubric with no code, the party external_ref `type`
    # being a default rather than a fixed PARTY, DV_MULTIMEDIA's bare key being
    # the uri, and the explicit subject|_type: PARTY_SELF at an RM-optional
    # PARTY_PROXY.
    #
    # Boundary tidied 2026-08-06 (no behaviour change): the three LEAF datatype
    # rows this grammar's machinery enabled -- DV_PARSABLE, DV_MULTIMEDIA and
    # DV_INTERVAL<T> -- moved out of wire.md § REQ-140's table into § REQ-053
    # § Leaf datatypes, where the other leaf suffix sets live. Each is reachable
    # at a Web Template leaf with no `_` segment at all, so REQ-053 owns them;
    # this grammar reaches the same three through nested VALUE positions
    # (_thumbnail, original_content, an interval bound) and applies their leaf
    # rules verbatim. The behavioural rules stayed here, cross-referenced from
    # the moved rows: the DV_MULTIMEDIA bare-code terminology rule (it governs
    # the underscore CODE_PHRASE members too) and the interval boundary flags
    # (introduced by _normal_range, shared with the leaf).
    #
    # STILL DEFERRED (refused loudly and none dropped, except the composer
    # boundary noted below, which encode projects rather than refuses):
    # _instruction_details
    # (ACTION) and _wf_definition (INSTRUCTION) — spec-named, corpus-unexercised
    # as a decodable grammar, so no fixture can pin them yet; FEEDER_AUDIT_DETAILS
    # other_details (an ITEM_STRUCTURE with no channel in the reference's suffix
    # set); PARTICIPATION time (same); the composer boundary — external_ref,
    # composer/_identifier:N and composer/relationship, which ADR 0015 gives no
    # carrier, an ADR decision rather than a codec one. That boundary is
    # asymmetric and deliberately so: decode refuses those spellings (census-
    # visible), while encode projects ONE of them -- a PARTY_IDENTIFIED composer
    # carrying a name keeps the name and DROPS its external_ref / identifiers,
    # rather than refuse every composition whose composer is properly referenced
    # (one vendored corpus body is). Every other shape is refused on encode too:
    # a PARTY_RELATED composer, a PARTY_SELF with an external_ref, and a nameless
    # PARTY_IDENTIFIED. That is one of TWO encode-side drops, not the only one:
    # the _uid / _link:N / _feeder_audit of a folded structural wrapper (ITEM_TREE,
    # HISTORY, a lifted EVENT) are dropped too, because FLAT has no key for a node
    # the Web Template does not model -- closable only reference-side (ADR 0014),
    # and structurally invisible to PROBE-086 whose input is FLAT; and the ctx/ short forms ADR 0016 decision 3 declines for the
    # EVENT_CONTEXT optionals, which ride this grammar at their real paths
    # instead. Not an underscore question at all: the 19 keys this SDK's
    # WebTemplate projection does not carry (ism_transition/*, INTERVAL_EVENT
    # math_function/width, ACTION time, OBSERVATION history_origin, …), owned by
    # openehr/template/webtemplate/deviations.md.
    implementation: landed
    adrs:
      - docs/adr/0015-flat-metadata-spelling.md
      - docs/adr/0016-event-context-optionals-underscore-spelling.md
    probes: [PROBE-089]
    packages:
      - openehr/serialize/simplified
    tests:
      # The router, the simple families, the `:index` rules and the owner-kind
      # refusals.
      - openehr/serialize/simplified/rmattr_test.go
      # The value decorations, the interval grammar and the |raw boundary.
      - openehr/serialize/simplified/rmattr_value_test.go
      # The party grammar, the participations and the ENTRY subject leaf.
      - openehr/serialize/simplified/rmattr_party_test.go
      # Repeating collapsed ELEMENTs (owner walk + per-instance :index), the
      # interval encode/decode refusal symmetry and the composer projection.
      - openehr/serialize/simplified/rmattr_repeating_test.go
      # The encapsulated / interval leaves and the DataValue members.
      - openehr/serialize/simplified/rmattr_encapsulated_test.go
      # _feeder_audit (three tail levels), _provider, the |_type discriminator
      # and the other_details deferral.
      - openehr/serialize/simplified/rmattr_feeder_test.go
      # The captured-set widening (suffix form vs |raw) and the STRUCTURED "|"
      # member the underscore families forced.
      - openehr/serialize/simplified/datatypes_test.go
      - openehr/serialize/simplified/structured_test.go
      # The ADR 0015 composer boundary.
      - openehr/serialize/simplified/context_test.go
      # PROBE-089 — the per-family probe and its runner.
      - testkit/probes/serialize/probe_089_underscore_round_trip.go
      - testkit/probes/serialize/probes_test.go
      # PROBE-086 — the census pins that move in step with each landed family.
      - testkit/conformance/webtemplate/runner_test.go
    plans:
      - docs/plans/archive/2026-08-05-flat-rm-attributes.md

