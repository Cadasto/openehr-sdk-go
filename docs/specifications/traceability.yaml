  - id: REQ-116
    title: Template-level node naming and name-predicated paths
    canonical: docs/specifications/clinical-modeling.md#req-116--template-level-node-naming-and-name-predicated-paths
    status: draft
    # An OPT node may pin its LOCATABLE.name via a fixed C_STRING on the name
    # attribute. That template-level name — not the archetype concept term,
    # which every occurrence of a reused archetype shares — is what
    # distinguishes sibling archetype roots that fill a slot with the same
    # archetype. Spans four layers: parse + expose on the OPT node (REQ-100),
    # carry through the compiled tree (REQ-111), emit name predicates
    # ([archetype_id,'Name']) on the compiled AQL path of every node that pins
    # a name, and prefer the name for WebTemplate id derivation (REQ-106,
    # ADR 0014). Established against the upstream EHRbase goldens 2026-07-29:
    # the reference disambiguates by name alone (no numeric suffix appears in
    # corona_anamnese / multi_occurrence / AlternativeEvents, because each
    # sibling pins a distinct name), and name-predicates aqlPath 350x in the
    # corona golden vs 0x in constrain_test — which is why PROBE-075 holds
    # 104/104 without any of this. CORRECTED 2026-07-30: the predicate trigger
    # is the pinned name ALONE, not sibling collision — GECCO_Diagnose
    # predicates all three /content children though their archetype ids are
    # distinct, and predicates a sole CLUSTER child; every predicate name in
    # both goldens is a pinned C_STRING (1:1), and constrain_test pins none,
    # which is the real reason parity holds. An earlier collision-conditioned
    # reading of this rule was wrong and would emit too few predicates.
    # LANDED 2026-07-31 (Phases 0-5). Unblocked PROBE-086 (upstream FLAT
    # parity), which landed on it 2026-08-01, and exports any
    # WebTemplate reusing an archetype among siblings. Where no pinned name
    # separates siblings the reference's ordinal fallback applies (dv_text,
    # dv_text2) — evidenced by the upstream FLAT bodies themselves. Path shape is consumed by
    # REQ-102 validation, REQ-107 instance synthesis, and REQ-053
