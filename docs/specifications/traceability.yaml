  - id: REQ-117
    title: AQL expression-catalogue completion
    canonical: docs/specifications/clinical-modeling.md#req-117--aql-expression-catalogue-completion
    status: draft
    # Closes the REQ-113 v1 structured-AST catalogue gaps (all grammar-admitted
    # already — no grammar-profile change), widens the REQ-109 lint gate's two
    # documented over-rejections (ORDER BY on a SELECT alias; bare boolean
    # literals in comparison-operand and SELECT positions), and gives the
    # REQ-055 builder the containment
    # algebra (NOT CONTAINS, sibling AND/OR) plus opt-in in-text LIMIT/OFFSET
    # that the parse side already models. Driven by consumers building AQL
    # execution engines and conformance corpora on the structured AST, where
    # ErrIncompleteAST is fail-closed and every catalogue gap is a refused
    # statement.
    #
    # LANDED. All eight catalogue closures are modelled: primitive SELECT
    # literals (LiteralExpr) and mixed `SELECT *, col` (StarExpr), function
    # calls on either side of a comparison with Path/Value/Param/nested-call
    # arguments, path-valued operands (aql.PathValue), structured MATCHES
    # TERMINOLOGY / {URI} operands, the FROM-root containment junction
    # (parse.FromClause.Junction), and junctions over any in-catalogue operand.
    # The complete residual ErrIncompleteAST list is two classes: a numeric
    # literal the AST cannot represent (LIMIT/OFFSET beyond Go `int`, an
    # INTEGER beyond int64, or a REAL beyond float64, in any value position;
    # degrading would be silent precision loss), pinned by
    # TestParseQuerySurfacesIncompleteAST, and a SELECT TOP clause, pinned
    # by TestParseQuerySurfacesTopClauseGap —
    # with TestFormerCatalogueGapsModelled asserting the nine round-trip cases covering the eight closed gap shapes
    # now parse, emit, and round-trip (PROBE-087).
    #
    # Lint (PROBE-028 unaffected, no new codes): parse.Document gains
    # SelectAliases so an ORDER BY key resolves FROM/CONTAINS first, then the
    # SELECT `AS` aliases (TestLintOrderBySelectAlias,
    # TestLintSelectAliasDoesNotBindClass); a bare boolean keyword in a value
    # position — a comparison operand, a SELECT projection item, or a function-call argument — is no longer
    # collected as a pseudo-path, and the structured AST carries it as a typed
    # literal on both sides (TestLintBooleanComparisonOperand,
    # TestLintSelectBooleanKeywordLiteral,
    # TestExtractPathsSkipsBooleanKeywordOperand,
    # TestExtractPathsSkipsBooleanKeywordSelectItem,
    # TestParseQuerySelectKeywordLiteral). An ORDER BY key is excluded: the
    # grammar's orderByExpr admits no literal, so it stays a path.
    #
    # Builder (PROBE-088): aql.Containment became a whole expression —
    # Class/Archetype leaves, Contains/NotContains nesting, ContainsAnd/
    # ContainsOr junctions with precedence-driven parentheses — plus opt-in
    # LimitInline/OffsetInline (+Param) refused against the envelope channel.
    # NOTE: Containment gained a slice field, so it is no longer ==-comparable
    # (fields unexported; no in-repo comparisons). A builder program using none
    # of the new API is byte-identical (the PROBE-020 golden is re-pinned by
    # TestProbe088DetectsProbe020Drift). DEFERRED: no builder entry point for a
    # FROM-root junction — the write side keeps a single root class until a
    # consumer needs write-side root junctions.
    implementation: landed
    packages:
      - openehr/aql
      - openehr/aql/parse
      - openehr/aql/lint
      - testkit/probes/aql
    probes: [PROBE-087, PROBE-088]
    tests:
      # PROBE-087 — catalogue closures, per-shape structural pins, and the
      # residual guards (unrepresentable numeric literal; SELECT TOP).
      - openehr/aql/parse/query_test.go
      - openehr/aql/parse/roundtrip_test.go
      - openehr/aql/introspect_test.go
      # Lint acceptances (REQ-109 surface) and the pseudo-path exclusion.
      - openehr/aql/lint/lint_test.go
      - openehr/aql/lint/extract_test.go
      - openehr/aql/parse/ast_test.go
      - openehr/aql/parse/parse_test.go
      # PROBE-088 — builder containment algebra, in-text paging, goldens.
      - openehr/aql/containment_test.go
      - openehr/aql/containment_roundtrip_test.go
      - openehr/aql/paging_test.go
      - openehr/aql/builder_internal_test.go
      - testkit/probes/aql/probes_test.go
    plans:
      - docs/plans/archive/2026-08-04-aql-expressivity-completion.md

