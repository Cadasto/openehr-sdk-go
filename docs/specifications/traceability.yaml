  - id: REQ-144
    title: Definition metadata decoding
    canonical: docs/specifications/wire.md#req-144--definition-metadata-decoding
    status: draft
    implementation: landed
    packages: [openehr/client/definition]
    adrs: [docs/adr/0019-definition-timestamp-tolerance.md]
    plans: [docs/plans/archive/2026-08-30-definition-metadata-decoding.md]
    tests:
      - openehr/client/definition/template_test.go
      - openehr/client/definition/stored_query_test.go
    notes: >-
      Decode of the two Definition catalog timestamps
      (TemplateMetadata.created_timestamp, StoredQueryMetadata.saved) accepts a
      CLOSED layout set: RFC3339/RFC3339Nano, 2006-01-02T15:04:05,
      2006-01-02T15:04, and the space-separated 2006-01-02 15:04:05 (deployment
      interop -- not ISO 8601 extended, not REST-legal, accepted because
      deployments emit it). Fractional seconds ride the seconds-bearing
      layouts via stdlib time.Parse absorption; the minute-precision layout
      takes neither. The pin is ASYMMETRIC about the two fields, which is why
      the leniency is a departure for one and a correction for the other:
      created_timestamp is required but a bare `type: string` with no format
      (resources/its-rest/definition-validation.openapi.yaml:509, :521-522), so
      RFC3339-only decode over-constrained a field the pin never constrained;
      saved is required with `format: date-time` (:3872, :3882-3884), so its
      tolerance genuinely exceeds the pin and is the keyed REQ-095 exception
      ADR 0019 grants on deployment evidence (609a104, a space-separated
      created_timestamp aborting a whole ListTemplates decode). Zone-less values
      decode as UTC and therefore re-marshal with a Z the wire never carried;
      the pinned REST overview assumes the deployment's LOCAL zone
      (overview-validation.openapi.yaml:675), which an SDK cannot know for a
      remote server -- recorded as ADR 0019 departure (c), not a time.Parse side
      effect. Absent/null/empty yields the zero time with no error (departure
      (b)); a non-empty unparseable value fails the containing item and the list
      call naming the field, never a silent zero. Encode is unchanged (RFC 3339)
      -- asymmetric tolerance, ADR 0004's precedent. Also fixes the empty-BODY
      arm: ListTemplates/ListStoredQueries return a non-nil zero-length slice
      (a nil slice boxed in a non-nil interface marshals as JSON null -- the
      read-side twin of the REQ-094 typed-nil trap). The unknown-key (Extras)
      contract is this §'s too, for BOTH descriptors, including the
      documented-field-wins collision rule: StoredQueryMetadata reached
      TemplateMetadata's re-emit parity here. Pinned per descriptor by
      the collision rows of TestStoredQueryMetadataExtrasRoundTrip and
      TestTemplateMetadataRoundTrip -- one row per mechanism, since deleting
      the known-key deletion and restoring Extras-last precedence fail
      different rows. Preserved values survive up to the insignificant
      whitespace encoding/json compacts and the <, > and & it escapes as
      \u003c, \u003e and \u0026 inside a json.RawMessage -- the escaped spelling
      decodes to the identical value -- so those tests normalise the want
      through json.Marshal (the encode path itself) rather than comparing raw
      bytes.

  - id: REQ-150
    title: Path-parameter segment validation
    canonical: docs/specifications/transport.md#req-150--path-parameter-segment-validation
    status: draft
    implementation: landed
    packages: [transport, openehr/client]
    probes: [PROBE-091]
    plans: [docs/plans/archive/2026-08-18-path-segment-validation.md]
    tests:
      - transport/path_test.go
      - openehr/client/route_guard_test.go
      - openehr/client/ehr/composition/composition_test.go
      - testkit/probes/transport/probes_test.go
    notes: >-
      ValidatePathSegment / ValidateRequestPath refuse a segment that is
      "." / ".." / empty or carries "/", "\\", a C0 control byte or DEL;
      the chain wraps both ErrInvalidPathSegment and ErrInvalidConfig, and the
      sentinels stay independent values. Enforced at Do's request-preparation
      site (not inside joinTarget, whose call site already wraps
      ErrInvalidConfig) together with the Route-arity rule that catches a
      separator smuggled inside one parameter. A Path of exactly "/" is the
      service root and passes -- the System API sends OPTIONS /. Route gates
      the arity half, so openehr/client carries an AST tripwire holding every
      transport.Request literal to setting it.

  - id: REQ-151
    title: Typed 2xx decode failure
    canonical: docs/specifications/transport.md#req-151--typed-2xx-decode-failure
    status: draft
    implementation: landed
    packages: [transport, openehr/client/definition, openehr/client/system, openehr/client/demographic, openehr/client/ehr/composition, testkit/probes/transport]
    probes: [PROBE-101]
    adrs: [docs/adr/0018-raw-bytes-on-decode-error.md]
    plans: [docs/plans/archive/2026-08-30-read-path-decode-taxonomy.md]
    tests:
      - transport/decode_error_test.go
      - openehr/client/definition/decode_error_test.go
      - openehr/client/system/decode_error_test.go
      - openehr/client/demographic/decode_error_test.go
      - openehr/client/ehr/composition/decode_error_test.go
      - openehr/client/ehr/decode_error_test.go  # § Keyed exclusions, the Prefer=identifier arm
      - openehr/client/ehr/contribution/decode_error_test.go  # § Keyed exclusions, the write-result funnel
      - testkit/probes/transport/probes_test.go
    notes: >-
      transport.DecodeError carries the request's method and route template,
      the raw response bytes and the decoder's error. transport.Decode returns
      it for any 2xx body that will not decode, and the hand-rolled leaf
      decodes construct the same type -- five in definition, three in
      demographic, plus system.Capabilities and composition.Get -- so which
      implementation route a leaf took stays invisible to the caller.
      errors.AsType reaches it through each leaf's fmt.Errorf operation-name
      wrap; Body is populated unconditionally (ADR 0018), inheriting whatever
      ceiling the caller's WithMaxResponseBody sets, including none where
      REQ-093's negative escape hatch disabled the cap; Unwrap keeps the
      codec's own diagnostics reachable; Error() names the method, the route
      and the classification only -- never the body and never the wrapped
      decoder's text, which embeds offending values in `parse %q` form -- and
      answers on a nil receiver (REQ-025). The (*T, *Metadata, error) triple
      still populates metadata beside the error. Both disjointness arms are
      pinned negatively: a non-2xx stays *transport.WireError, and an empty
      representation-expecting 2xx body stays transport.ErrInvalidShape,
      deliberately not unified. The keyed exclusions keep their owning
      contracts and are pinned where they live: the ehr.WriteResult funnel and
      contribution.Commit (REQ-094 NoRepresentationError), the
      Prefer=identifier arm (ehr.ResolveIdentifierBody), the Definition
      list leaves, where an empty 2xx body is a successful empty catalog,
      and the four synthesized-metadata arms -- GetStoredQuery, PutStoredQuery,
      PutStoredQueryVersion and UploadTemplate -- where an empty 2xx body is a
      success the leaf answers from what it already knows (pre-existing
      deployment tolerance, 0352ce8). Scope follows the decode, not the verb,
      so the Definition upload/PUT leaves are in for their non-empty bodies.
      PROBE-101 holds the wire-level half in Sandbox mode.

