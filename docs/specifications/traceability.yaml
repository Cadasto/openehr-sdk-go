  - id: REQ-113
    title: Execution-oriented parsed AQL AST
    canonical: docs/specifications/clinical-modeling.md#req-113--execution-oriented-parsed-aql-ast
    status: draft
    # ParseQuery + Document.Query expose a stable, generated-type-free
    # structured AQL AST (parse.Query) — the read-side mirror of
    # aql.Builder. SELECT items / FROM containment tree / WHERE
    # expression tree / ORDER BY / LIMIT / OFFSET, populated from the
    # validated ANTLR tree (parse/gen) via the private extractor.
    # WhereExpr + Value vocabulary is SHARED with the construction side:
    # parse populates the same Comparison/Junction/NotExpr/ExistsExpr/
    # MatchesExpr/LikeExpr/ParamValue/StringValue/IntValue/RealValue/
    # BoolValue/NullValue the Builder constructs. (*Query).Emit +
    # aql.FormatWhere close the round-trip loop. PROBE-080 (round-trip
    # property) is carried inline by openehr/aql/parse/roundtrip_test.go
    # — 77 idempotence cases plus 36 canonical-input preservation cases
    # across the catalogue, plus the residual-gap suite asserting
    # ParseQuery and Emit both surface aql.ErrIncompleteAST. The corpus
    # grew when REQ-117 closed this REQ's v1 catalogue gaps (2026-08-04):
    # the extractor now covers the whole SDK grammar profile and the
    # residual refusals are an unrepresentable numeric literal and a
    # SELECT TOP clause — see the REQ-117 row and PROBE-087, which own
    # that closure.
    # Out-of-catalogue shapes never silently emit: ErrIncompleteAST is
    # the trust-model surface. Tier 1 — Document.Tree — exposes the
    # validated ANTLR tree as a cheap interim (unstable consumer
    # contract; marked // Deprecated:) ahead of the REQ-113 Tier-2 AST.
    # The standing class predicate (ClassExpr.PredicateComparison)
    # and the WHERE comparison path (aql.Comparison.ParsedPath) are exposed
    # as parsed structure; the shared path vocabulary (aql.IdentifiedPath /
    # PathSegment) moved into openehr/aql (openehr/aql/path.go) with parse
    # aliases. PROBE-082 pins it inline in structured_test.go. The
    # class-predicate ParsedPath is now populated too (Segments with an empty
    # Alias, mirroring the WHERE side) so a consumer need not re-split the
    # relative predicate path.
    implementation: landed
    packages:
      - openehr/aql
      - openehr/aql/parse
    probes:
      - PROBE-080
      - PROBE-082
    tests:
      - openehr/aql/introspect_test.go
