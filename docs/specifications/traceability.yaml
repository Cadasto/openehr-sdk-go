    packages: [transport, auth, smart/discovery, openehr/client/ehr, openehr/client/ehr/contribution, openehr/client/system, openehr/aql, openehr/aql/parse, openehr/aql/lint, openehr/aql/contain, openehr/client/query, openehr/rm/typereg, internal]
    tests:
      - openehr/client/ehr/contribution/version_test.go
      - openehr/client/ehr/contribution/submission_test.go
      - openehr/client/ehr/contribution/update_audit_test.go
      - openehr/aql/version_test.go
      - openehr/aql/lint/extract_test.go
      - openehr/aql/contain/nilrelation_test.go
      - openehr/aql/parse/nilsyntaxerror_test.go
      - openehr/client/query/nilaqlerror_test.go
      - openehr/client/query/nilwiredereference_internal_test.go
      - transport/client_test.go
      - transport/nilwireerror_test.go
      - transport/nilwiredereference_internal_test.go
      - auth/nilautherror_test.go
      - smart/discovery/nildiscoveryerror_test.go
      - openehr/rm/typereg/nildecodeerror_test.go
      - openehr/client/ehr/ehr_test.go
      - openehr/client/ehr/resource_test.go
      - internal/option_guard_test.go
    notes: >-
      The no-panic clause is enforced across the caller-constructible axis, not
      only at the contribution constructors: a typed-nil PartyProxy committer is
      refused at Validate and marshal, lint.Extract guards a nil/unparsed
      document, transport.Do guards a nil Client and Request for every
      Do-routed leaf while the admin probes guard their deliberate Do
      bypass themselves, and all 30 variadic-option loops skip a nil option
      — held by an AST tripwire in internal/option_guard_test.go. The nil
      RECEIVER is the same axis: a nil *contain.TypeRelation is the documented
      spelling of "the default", and a nil *query.AQLError is what a failed
      typed-error match leaves behind in either detection form — the errors.As
      out-parameter or an errors.AsType binding — so each answers as that
      value rather than dereferencing it —
      both held by reflection tripwires over the whole exported method set,
      each fed arguments that actually reach the receiver. A typed-nil
      *transport.WireError — the value a failed errors.As / errors.AsType
      leaves behind — answers Error and Unwrap rather than panicking
      (transport/nilwireerror_test.go), and answers with the text its own zero
      value produces, as *query.AQLError does; *ehr.NoRepresentationError sits
      on the same axis but deliberately answers a nil receiver with a text
      DIFFERENT from its zero value's, pinned at
      openehr/client/ehr/resource_test.go:66-76. The 2026-08-30 sweep closed
      the remaining proven-panicking receivers on the axis:
      discovery.DiscoveryError, auth.ExchangeError and auth.OAuth2Error (the
      latter returned nil by ParseOAuth2Error for a non-RFC-6749 body, so it
      reaches consumers with no errors.As involved), parse.SyntaxError, and
      typereg.DecodeError — re-exported as canjson.DecodeError and
      canxml.DecodeError, the documented errors.As out-parameter of both
      codecs. The four consumer sites that dereferenced a MATCHED-but-nil
      *transport.WireError are guarded too (errors.As / errors.AsType report
      ok for a boxed typed nil), and transport.Client's Catalog and HTTPClient
      accessors join Do on the nil-receiver rule. A sealed exported
      interface a caller can satisfy by EMBEDDING rather than implementing it
      is the nil-adjacent arm of the same axis: an aql.VersionPredicate whose
      embedded field is nil dereferences a nil interface at both dispatch
      sites, so REQ-163's carrier refuses it at Build() as ErrInvalidQuery
      and the emission path answers rather than panicking. The clause carries a Must-prefix carve-out for the Go
      convention.

